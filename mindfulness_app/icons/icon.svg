<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9c8c"/>
      <stop offset="100%" style="stop-color:#6b5b95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#circleGrad)" stroke-width="12" opacity="0.3"/>

  <!-- Middle ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#circleGrad)" stroke-width="8" opacity="0.5"/>

  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#4a9c8c" stroke-width="4" opacity="0.8"/>

  <!-- Center meditation figure (simplified lotus) -->
  <g transform="translate(256, 256)">
    <!-- Lotus petals -->
    <ellipse cx="0" cy="30" rx="60" ry="25" fill="#4a9c8c" opacity="0.6"/>
    <ellipse cx="-45" cy="10" rx="40" ry="20" fill="#4a9c8c" opacity="0.5" transform="rotate(-30)"/>
    <ellipse cx="45" cy="10" rx="40" ry="20" fill="#4a9c8c" opacity="0.5" transform="rotate(30)"/>

    <!-- Figure silhouette -->
    <circle cx="0" cy="-40" r="25" fill="#c4a35a"/>
    <path d="M-35 0 Q-40 40 0 50 Q40 40 35 0 Q20 20 0 25 Q-20 20 -35 0" fill="#c4a35a"/>
  </g>

  <!-- Sound waves -->
  <g opacity="0.4">
    <path d="M100 256 Q80 220 100 180" fill="none" stroke="#4a9c8c" stroke-width="4" stroke-linecap="round"/>
    <path d="M80 256 Q55 210 80 160" fill="none" stroke="#4a9c8c" stroke-width="3" stroke-linecap="round"/>
    <path d="M412 256 Q432 220 412 180" fill="none" stroke="#4a9c8c" stroke-width="4" stroke-linecap="round"/>
    <path d="M432 256 Q457 210 432 160" fill="none" stroke="#4a9c8c" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
